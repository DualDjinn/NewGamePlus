name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: setup binary resource placeholders for CI
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries/RetroArch
          New-Item -ItemType Directory -Force -Path src-tauri/binaries/RPCS3
          if (-not (Test-Path src-tauri/binaries/libretrodb.sqlite)) { New-Item -ItemType File -Force -Path src-tauri/binaries/libretrodb.sqlite }
      - name: fmt
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: unit tests (herméticos; integración = #[ignore])
        run: cargo test --manifest-path src-tauri/Cargo.toml
