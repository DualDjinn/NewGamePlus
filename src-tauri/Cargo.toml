[package]
name = "gameflix"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
zip = "2"
walkdir = "2"
urlencoding = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
md5 = "0.7"
tauri-plugin-dialog = "2.7.2"
regex = "1"
rayon = "1.10"
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_Input_XboxController", "Win32_Security_Cryptography", "Win32_System_Memory"] }
